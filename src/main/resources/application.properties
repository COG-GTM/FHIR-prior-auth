server.port=9015
server.servlet.contextPath= /fhir
# server.ssl.key-store=pas_keystore.p12
# server.ssl.key-store-password=password
# server.ssl.keyStoreType=PKCS12
# server.ssl.keyAlias=pas

# BFD Integration
bfd.server.url=${BFD_SERVER_URL:https://localhost:1234}
bfd.client.cert.path=${BFD_CLIENT_CERT_PATH:}
bfd.client.key.path=${BFD_CLIENT_KEY_PATH:}
bfd.client.key.password=${BFD_CLIENT_KEY_PASSWORD:changeit}
bfd.client.trust-store.path=${BFD_TRUST_STORE_PATH:}
bfd.client.trust-store.password=${BFD_TRUST_STORE_PASSWORD:changeit}

# Database Configuration (default: H2 for development)
# Set DB_TYPE=postgresql, DB_URL, DB_USER, DB_PASSWORD env vars for PostgreSQL
db.type=${DB_TYPE:h2}
db.url=${DB_URL:jdbc:h2:./databaseData/database;DB_CLOSE_DELAY=-1}
db.user=${DB_USER:sa}
db.password=${DB_PASSWORD:}

# Prior Auth Settings
pa.pended.timeout.seconds=${PA_PENDED_TIMEOUT:60}
