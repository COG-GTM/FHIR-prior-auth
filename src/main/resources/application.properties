server.port=9015
server.servlet.contextPath= /fhir

# Transmission security (45 CFR 164.312(e)). TLS is ON by default; only the
# "dev" profile (application-dev.properties) turns it off. Supply the keystore
# through the environment, e.g.:
#   SERVER_SSL_KEY_STORE=file:/run/secrets/pas_keystore.p12
#   SERVER_SSL_KEY_STORE_PASSWORD=<secret>
#   SERVER_SSL_KEY_STORE_TYPE=PKCS12   (default)
#   SERVER_SSL_KEY_ALIAS=pas           (optional)
# The service refuses to start with TLS enabled and no keystore configured.
server.ssl.enabled=${SERVER_SSL_ENABLED:true}
server.ssl.key-store=${SERVER_SSL_KEY_STORE:}
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${SERVER_SSL_KEY_STORE_TYPE:PKCS12}

# Comma-separated CORS / WebSocket origin allow-list, e.g.
#   CORS_ALLOWED_ORIGINS=https://ehr.example.org,https://portal.example.org
# Empty (default) means same-origin only. "*" is ignored.
priorauth.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
