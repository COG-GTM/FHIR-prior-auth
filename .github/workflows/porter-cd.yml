name: Porter Invocation Docker Image CD

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

env:
  PORTER_VERSION: v1.6.1
  PORTER_MIXIN_VERSION: v1.0.6

jobs:
  porter-cd:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout Repository
      uses: actions/checkout@v2
      
    - run: 'echo "COMPOSE_PROJECT_NAME=pas_porter" >> .env; echo "PORTER_ALLOW_DOCKER_HOST_ACCESS=true" >> .env'
      shell: bash

    - name: Install Porter
      run: curl -fsSL https://cdn.porter.sh/${PORTER_VERSION}/install-linux.sh | bash

    - name: Set Porter path
      run: echo "~/.porter" >> $GITHUB_PATH

    - name: Install Porter Mixins
      run: |
        porter mixins install docker --version ${PORTER_MIXIN_VERSION}
        porter mixins install docker-compose --version ${PORTER_MIXIN_VERSION}

    - name: Build Invocation Image
      run: porter build 

    - name: Login to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
        
    - name: Publish Invocation Image
      run: porter publish --tag current
